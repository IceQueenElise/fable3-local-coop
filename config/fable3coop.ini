; Fable3Coop settings. Copy next to xinput1_3.dll in the Fable III folder.
[Fable3Coop]
; 1 writes fable3coop.log (diagnostics, every gameplay button press); 0 turns it off.
Log=0
; 1: player 2's START opens a hero picker before joining; 0: join straight away.
PartnerPicker=1
; Save player 2 joins with when the picker is off: blank = the game's choice (newest
; henchman save), new = a new hero, or a save name from player 2's folder (e.g. hero5).
; A full main save loads only its hero; co-op progress saves back into that hero.
PartnerSave=

[Heroes]
; Optional names shown in the picker, by save name, e.g.:
; hero5autosave=Bob
